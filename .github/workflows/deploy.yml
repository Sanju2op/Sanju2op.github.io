name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install and build the Astro site
        run: |
          npm install
          npm run build

      # Renders the built page to dist/resume.pdf with the print stylesheet.
      # Not fatal: if it fails the site still deploys, but the Download PDF link will 404.
      - name: Make the resume PDF
        continue-on-error: true
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install playwright
          playwright install --with-deps chromium
          python3 -m http.server 4321 --directory dist &
          sleep 2
          python3 scripts/make_pdf.py http://localhost:4321/ dist/resume.pdf
          kill %1 || true

      # Warns (does not fail) if the PDF is missing, longer than one page, or has no selectable text.
      - name: Check the PDF
        run: |
          if [ -s dist/resume.pdf ]; then
            . .venv/bin/activate
            pip install pypdf
            python3 scripts/check_pdf.py dist/resume.pdf
          else
            echo "::warning::resume.pdf was not created, so the Download PDF link will 404"
          fi

      # The older sub-projects are plain static folders. Copy them next to the
      # built site so every existing link (for example /MusicApp/) keeps working.
      - name: Copy static sub-projects into the build
        run: |
          for d in MusicApp project_1 project_2 project_3 project_4 keyboardShopApp "Gym Web" "Clothng web" images; do
            if [ -d "$d" ]; then cp -r "$d" dist/; else echo "skipped (not found): $d"; fi
          done
          if [ -f index.backup.html ]; then cp index.backup.html dist/; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
