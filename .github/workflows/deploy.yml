name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install and build the Astro site
        run: |
          npm install
          npm run build

      # The older sub-projects are plain static folders. Copy them next to the
      # built site so every existing link (for example /MusicApp/) keeps working.
      - name: Copy static sub-projects into the build
        run: |
          for d in MusicApp project_1 project_2 project_3 project_4 keyboardShopApp "Gym Web" "Clothng web" images; do
            if [ -d "$d" ]; then cp -r "$d" dist/; else echo "skipped (not found): $d"; fi
          done
          if [ -f index.backup.html ]; then cp index.backup.html dist/; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
